<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BoltBall">
<meta name="description" content="BoltBall : die and retry à une touche. 100 niveaux, mode Endless, 100 skins à débloquer.">
<title>BoltBall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff3333'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#ff3344;--red2:#ff6a3d;--bg:#050508;--card:#0d0d14;--line:#22222e;--mut:#8a8a9e;--txt:#f2f2f6;--gold:#ffd84a}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Arial Black","Arial",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.off{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 30%,rgba(40,6,14,.9),rgba(0,0,0,.95) 70%);pointer-events:all;overflow-y:auto}
.scr.dim{background:rgba(0,0,0,.78)}
.scr.clear{background:linear-gradient(transparent 40%,rgba(0,0,0,.75))}
#s-story,#s-coll,#s-lb,#s-set{justify-content:flex-start}
.logo{font-size:clamp(2.2rem,11vw,4.2rem);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 24px rgba(255,51,68,.6);line-height:1;cursor:pointer}
.logo span{color:var(--red);text-shadow:0 0 30px var(--red),0 0 60px rgba(255,0,0,.4)}
.tag{color:var(--mut);font-size:.72rem;letter-spacing:.3em;font-family:Arial,sans-serif;font-weight:700;text-align:center}
#homeSkin{width:96px;height:96px;margin:2px 0}
input[type=text]{padding:12px 16px;font:900 1rem "Arial Black",Arial,sans-serif;border-radius:12px;border:2px solid var(--red);background:#0d0d14;color:#fff;text-align:center;outline:none;width:min(260px,80vw);text-transform:uppercase;letter-spacing:.2em}
.btn{font:900 .86rem "Arial Black",Arial,sans-serif;letter-spacing:.06em;padding:11px 18px;border-radius:12px;border:none;cursor:pointer;color:#fff;transition:transform .08s,filter .15s;display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.btn:active{transform:scale(.94)}
.btn small{font:700 .62rem Arial,sans-serif;letter-spacing:.08em;opacity:.8}
.btn.big{width:min(300px,82vw);padding:13px 18px;font-size:1rem}
.btn.sm{padding:8px 12px;font-size:.7rem}
.red{background:linear-gradient(180deg,#ff4455,#d01a2a);box-shadow:0 4px 0 #7a0812,0 0 22px rgba(255,51,68,.35)}
.alt{background:linear-gradient(180deg,#ffb020,#e06a00);box-shadow:0 4px 0 #7a3a00,0 0 22px rgba(255,150,0,.3)}
.drk{background:#14141e;color:#c8c8d8;border:1px solid var(--line)}
.menu{display:flex;flex-direction:column;align-items:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.top{display:flex;align-items:center;justify-content:space-between;width:min(560px,100%);gap:10px;margin-bottom:4px}
.top h2{font-size:1.1rem;letter-spacing:.15em}
h2.big{font-size:2rem;color:var(--red);letter-spacing:.2em;margin-bottom:8px}
h3{font-size:.9rem;letter-spacing:.12em;color:#fff;margin:4px 0}
.pill{font:700 .72rem Arial,sans-serif;background:#14141e;border:1px solid var(--line);padding:5px 10px;border-radius:99px;color:var(--gold);white-space:nowrap}
.hint{font:700 .7rem Arial,sans-serif;color:var(--mut);text-align:center;max-width:520px;line-height:1.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button,#chTabs button{font:900 .68rem "Arial Black",Arial,sans-serif;padding:7px 11px;border-radius:9px;background:#101018;color:var(--mut);border:1px solid var(--line);cursor:pointer}
.tabs button.on,#chTabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
#chTabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:560px}
#chTabs button.lk{opacity:.35}
#lvGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(520px,100%)}
.lc{min-height:74px;padding:6px 2px;overflow:hidden;white-space:nowrap;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
.lc b{font-size:1.05rem}
.lc .st{color:var(--gold);font-size:.7rem;letter-spacing:.05em;font-family:Arial,sans-serif}
.lc .st i{color:#333;font-style:normal}
.lc .co{font:700 .58rem Arial,sans-serif;color:var(--gold)}
.lc .dd{font:700 .58rem Arial,sans-serif;color:var(--mut)}
.lc.done{border-color:var(--red)}
.lc.boss{background:linear-gradient(160deg,#2a0610,#0d0d14)}
.lc.boss b{color:var(--red)}
.lc.lck{opacity:.3;cursor:default}
.lc.nx{box-shadow:0 0 0 2px #fff inset}
#collGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(760px,100%);padding-bottom:20px}
.cc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:76px}
.cc canvas{width:52px;height:52px;flex:none}
.cc.lck canvas{filter:brightness(0) opacity(.5)}
.cc.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,216,74,.25)}
.cc .t{font-size:.66rem;letter-spacing:.04em;line-height:1.2}
.cc .d{font:700 .6rem Arial,sans-serif;color:var(--mut);line-height:1.3;margin-top:2px}
.cc .pb{height:4px;background:#22222e;border-radius:4px;margin-top:5px;overflow:hidden}
.cc .pb i{display:block;height:100%;background:var(--red)}
#lbList{width:min(520px,100%);display:flex;flex-direction:column;gap:4px;padding-bottom:20px}
.lr{display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.78rem}
.lr .rk{color:var(--mut)}
.lr .sc{color:var(--gold)}
.lr .de{font:700 .66rem Arial,sans-serif;color:var(--mut)}
.lr.me{border-color:var(--red);background:#1a0a10}
.set{display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.06em;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.set input[type=text]{width:150px;padding:8px;font-size:.8rem}
.tog,.tog2{font:900 .7rem "Arial Black",Arial,sans-serif;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#101018;color:var(--mut);cursor:pointer;min-width:64px}
.tog.on{background:var(--red);color:#fff;border-color:var(--red)}
input[type=range]{accent-color:var(--red);width:150px}
.card{background:rgba(10,10,16,.92);border:2px solid var(--red);border-radius:18px;padding:18px 18px 12px;width:min(340px,92vw);display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;box-shadow:0 0 40px rgba(255,51,68,.25)}
#dStars{font-size:2rem;letter-spacing:.15em;color:var(--gold);text-shadow:0 0 18px rgba(255,216,74,.6)}
#dStars i{color:#2a2a34;font-style:normal;text-shadow:none}
#dTitle,#oTitle{font-size:.85rem;letter-spacing:.12em}
.bigv{font-size:1.9rem;color:var(--red)}
.sub{font:700 .74rem Arial,sans-serif;color:var(--mut)}
#hud{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px 8px;z-index:5;pointer-events:none;background:linear-gradient(rgba(0,0,0,.5),transparent);font-size:.82rem}
.hl{display:flex;flex-direction:column}
#hSub{font:700 .62rem Arial,sans-serif;color:var(--mut)}
.hc{display:flex;align-items:center;gap:8px}
#prog{width:min(36vw,280px);height:8px;background:rgba(255,255,255,.12);border-radius:8px;position:relative;overflow:visible}
#progF{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);will-change:transform;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:8px}
#progB{position:absolute;top:-4px;width:2px;height:16px;background:var(--gold);left:0;box-shadow:0 0 6px var(--gold)}
#hPct{font:900 .72rem Arial,sans-serif;min-width:40px}
.hr{display:flex;justify-content:flex-end;align-items:center;gap:10px}
#hDeaths{color:var(--red)}
#hDeaths::before{content:"✕ ";font-size:.7rem}
#pbtn{pointer-events:all;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;width:34px;height:30px;font:900 .7rem Arial;cursor:pointer}
#flash{position:fixed;inset:0;background:rgba(255,30,30,.45);pointer-events:none;opacity:0;transition:opacity .2s;z-index:4}
#rot{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:700 .7rem Arial,sans-serif;color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:99px;z-index:5;pointer-events:none}
#toasts{position:fixed;top:max(46px,calc(env(safe-area-inset-top) + 40px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none;width:min(340px,92vw)}
.toast{display:flex;align-items:center;gap:10px;background:rgba(12,12,18,.95);border:1.5px solid var(--gold);border-radius:14px;padding:8px 12px;animation:tin .35s ease-out;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.toast canvas{width:44px;height:44px;flex:none}
.toast .k{font:700 .58rem Arial,sans-serif;color:var(--gold);letter-spacing:.14em}
.toast .t{font-size:.82rem}
.toast .d{font:700 .62rem Arial,sans-serif;color:var(--mut)}
.toast.out{animation:tout .35s ease-in forwards}
@keyframes tin{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
@media (max-height:480px){.scr{gap:7px}.btn.big{padding:9px 14px;font-size:.88rem}#homeSkin{width:64px;height:64px}.logo{font-size:2.2rem}}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;z-index:6;opacity:0}
#banner .t{font-size:clamp(1.6rem,8vw,3rem);color:#fff;letter-spacing:.08em;text-shadow:0 0 24px rgba(255,51,68,.9),0 3px 0 rgba(0,0,0,.6)}
#banner .s{font:900 clamp(.75rem,3.4vw,1rem) "Arial Black",Arial,sans-serif;color:var(--gold);letter-spacing:.12em;margin-top:6px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#banner.in{animation:bin .35s ease-out forwards}
#banner.out{animation:bout .35s ease-in forwards}
@keyframes bin{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
@keyframes bout{from{opacity:1}to{opacity:0;transform:translateY(-14px)}}

.toast.mini{align-self:center;padding:4px 12px 4px 6px;border-radius:99px;gap:6px;background:rgba(12,12,18,.8)}
.toast.mini canvas{width:26px;height:26px}
.toast.mini .k,.toast.mini .d{display:none}
.toast.mini .t{font-size:.68rem;color:var(--gold)}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<!-- HUD -->
<div id="hud" class="off">
  <div class="hl"><span id="hName">1-1</span><span id="hSub"></span></div>
  <div class="hc"><div id="prog"><i id="progF"></i><b id="progB"></b></div><span id="hPct">0 %</span></div>
  <div class="hr"><span id="hDeaths">0</span><button id="pbtn" aria-label="Pause">II</button></div>
</div>
<div id="rot" class="off"></div>
<div id="banner" class="off"><div class="t"></div><div class="s"></div></div>
<div id="toasts"></div>

<div class="ui">
<!-- PSEUDO -->
<section class="scr off" id="s-name">
  <div class="logo"><span>BOLT</span>BALL</div>
  <p class="tag">DIE · RETRY · DOMINATE</p>
  <input type="text" id="inp" placeholder="TON PSEUDO" maxlength="12" autocomplete="off" spellcheck="false">
  <button class="btn red big" id="bName">JOUER</button>
</section>

<!-- ACCUEIL -->
<section class="scr off" id="s-home">
  <div class="logo" id="logo"><span>BOLT</span>BALL</div>
  <p class="tag" id="hello"></p>
  <canvas id="homeSkin" width="120" height="120"></canvas>
  <div class="menu">
    <button class="btn red big" data-go="cont" id="bCont">CONTINUER<small id="mCont"></small></button>
    <button class="btn drk big" data-go="story">CHAPITRES<small id="mStory"></small></button>
    <button class="btn red big" data-go="endless">ENDLESS<small id="mEnd"></small></button>
    <button class="btn alt big" data-go="daily">DÉFI DU JOUR<small id="mDaily"></small></button>
    <div class="row">
      <button class="btn drk" data-go="coll">SKINS <small id="mColl"></small></button>
      <button class="btn drk" data-go="lb">CLASSEMENT</button>
      <button class="btn drk" data-go="set">RÉGLAGES</button>
    </div>
  </div>
</section>

<!-- HISTOIRE -->
<section class="scr off" id="s-story">
  <div class="top"><button class="btn drk sm" data-go="home">RETOUR</button><h2>HISTOIRE</h2><span class="pill" id="stStars"></span></div>
  <div id="chTabs"></div>
  <h3 id="chName"></h3>
  <div id="lvGrid"></div>
  <p class="hint" id="chHint"></p>
</section>

<!-- SKINS & EXPLOITS -->
<section class="scr off" id="s-coll">
  <div class="top"><button class="btn drk sm" data-go="home">RETOUR</button><h2>SKINS</h2><span class="pill" id="collCount"></span></div>
  <div class="tabs" id="collTabs"><button data-f="all" class="on">TOUS</button><button data-f="got">DÉBLOQUÉS</button><button data-f="todo">À FAIRE</button></div>
  <div id="collGrid"></div>
</section>

<!-- CLASSEMENT -->
<section class="scr off" id="s-lb">
  <div class="top"><button class="btn drk sm" data-go="home">RETOUR</button><h2>CLASSEMENT</h2><span></span></div>
  <div class="tabs" id="lbTabs"><button data-m="endless" class="on">ENDLESS</button><button data-m="daily">DÉFI DU JOUR</button><button data-m="story">HISTOIRE</button></div>
  <p class="hint" id="lbInfo"></p>
  <div id="lbList"></div>
</section>

<!-- RÉGLAGES -->
<section class="scr off" id="s-set">
  <div class="top"><button class="btn drk sm" data-go="home">RETOUR</button><h2>RÉGLAGES</h2><span></span></div>
  <div class="set">
    <label>Pseudo<input type="text" id="setName" maxlength="12" spellcheck="false"></label>
    <label>Musique<button class="tog" data-s="music"></button></label>
    <label>Effets sonores<button class="tog" data-s="sfx"></button></label>
    <label>Volume<input type="range" id="setVol" min="0" max="1" step=".05"></label>
    <label>Flash à la mort<button class="tog" data-s="flash"></button></label>
    <label>Tremblement d’écran<button class="tog" data-s="shake"></button></label>
    <p class="hint">Saut : tap, clic, Espace ou ↑ · Maintenir = saut plus haut · R = recommencer · Échap = pause</p>
    <button class="btn drk sm" id="bReset">EFFACER MA PROGRESSION</button>
  </div>
</section>

<!-- PAUSE -->
<section class="scr off dim" id="s-pause">
  <h2 class="big">PAUSE</h2>
  <div class="menu">
    <button class="btn red big" id="bResume">REPRENDRE</button>
    <button class="btn drk" id="bRestart">RECOMMENCER</button>
    <button class="btn drk" id="bPractice"></button>
    <div class="row"><button class="btn drk sm tog2" data-s="music"></button><button class="btn drk sm tog2" data-s="sfx"></button></div>
    <div class="row"><button class="btn drk sm" id="bShare3">PARTAGER</button><button class="btn drk sm" id="bQuit">MENU</button></div>
  </div>
</section>

<!-- FIN DE NIVEAU -->
<section class="scr off clear" id="s-done">
  <div class="card">
    <div id="dStars"></div>
    <div id="dTitle"></div>
    <div class="bigv" id="dDeaths"></div>
    <div class="sub" id="dSub"></div>
    <div class="row">
      <button class="btn red" id="bNext">SUIVANT</button>
      <button class="btn drk" id="bRetry">REJOUER</button>
    </div>
    <div class="row">
      <button class="btn drk sm" id="bShare1">PARTAGER</button>
      <button class="btn drk sm" id="bMenu1">MENU</button>
    </div>
    <p class="hint" id="dReplay">Replay de tous tes essais</p>
  </div>
</section>

<!-- FIN DE COURSE ENDLESS -->
<section class="scr off clear" id="s-over">
  <div class="card">
    <div id="oTitle">ENDLESS</div>
    <div class="bigv" id="oDist"></div>
    <div class="sub" id="oSub"></div>
    <div class="sub" id="oRank"></div>
    <div class="row">
      <button class="btn red" id="bAgain">REJOUER</button>
      <button class="btn drk sm" id="bShare2">PARTAGER</button>
    </div>
    <button class="btn drk sm" id="bMenu2">MENU</button>
    <p class="hint">Espace ou tap pour relancer</p>
  </div>
</section>
</div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
//  CORE : constantes, aléatoire, mondes, génération, physique
//  (aucune dépendance au DOM : chargé aussi par le solveur Node)
// ════════════════════════════════════════════════════════════════

// Monde virtuel : 800 x 450 unités, identique sur tous les écrans
const VW = 800, VH = 450, G = 370, PR = 16, PX = 180;
const GRAV = .58, JV = 13.5, JV2 = 12.6, JCUT = .45, MAXVY = 22, PADV = 17;
const COYOTE = 6, BUFFER = 8, ORB_R = 14, SPK_H = 28, WALL_W = 22;
const METER = 20; // 1 mètre = 20 unités

function rngOf(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function tri(v, mi, ma) {
  const r = ma - mi; if (r <= 0) return mi;
  const m = ((v - mi) % (2 * r) + 2 * r) % (2 * r);
  return mi + (m <= r ? m : 2 * r - m);
}

// ── MONDES (10 chapitres de 10 niveaux) ──────────────────────────
const WORLDS = [
  { n: 'ÉVEIL',            bpm: 116, c1: '#07071a', c2: '#1b0b35', gr: '#0d0d26', ed: '#5a5ae6', ac: '#ff3355', ob: '#e0284a', sil: 'hills',   root: 57, minor: true },
  { n: 'CÂBLES',           bpm: 120, c1: '#03140f', c2: '#062a1f', gr: '#04140f', ed: '#19c48a', ac: '#39ffb0', ob: '#ff3d6e', sil: 'towers',  root: 55, minor: true },
  { n: 'LA SCIERIE',       bpm: 124, c1: '#1a0b05', c2: '#2c1206', gr: '#170a04', ed: '#d07a2a', ac: '#ffb347', ob: '#ff4b2b', sil: 'teeth',   root: 52, minor: true },
  { n: 'ABYSSES',          bpm: 126, c1: '#020818', c2: '#04203a', gr: '#031024', ed: '#2a8bd6', ac: '#4fd8ff', ob: '#ff5577', sil: 'waves',   root: 50, minor: true },
  { n: 'DÉSERT ROUGE',     bpm: 130, c1: '#1f0705', c2: '#4a160a', gr: '#260a05', ed: '#e0573a', ac: '#ffd27a', ob: '#ff2e2e', sil: 'dunes',   root: 53, minor: false },
  { n: 'L’USINE',          bpm: 134, c1: '#0d0d10', c2: '#1d1d24', gr: '#111116', ed: '#8a8aa0', ac: '#ffe14d', ob: '#ff3b3b', sil: 'factory', root: 48, minor: true },
  { n: 'AURORE',           bpm: 136, c1: '#05061a', c2: '#0b2b33', gr: '#071420', ed: '#4dffc3', ac: '#c08cff', ob: '#ff4f9a', sil: 'peaks',   root: 57, minor: false },
  { n: 'LE VIDE',          bpm: 140, c1: '#000000', c2: '#0a0014', gr: '#050008', ed: '#7a3cff', ac: '#ffffff', ob: '#ff2266', sil: 'cubes',   root: 49, minor: true },
  { n: 'INFERNO',          bpm: 146, c1: '#200000', c2: '#3d0700', gr: '#1a0300', ed: '#ff5a1f', ac: '#ffcc33', ob: '#ff1a1a', sil: 'flames',  root: 52, minor: true },
  { n: 'CŒUR DE L’ÉCLAIR', bpm: 152, c1: '#0a0a00', c2: '#2a2400', gr: '#141200', ed: '#ffe14d', ac: '#ffffff', ob: '#ff3333', sil: 'bolts',   root: 54, minor: true },
];
const BOSS = ['LE GARDIEN', 'LE NŒUD', 'LA GRANDE LAME', 'LE LÉVIATHAN', 'LE MIRAGE', 'LA PRESSE', 'LE VOILE', 'L’ABSENCE', 'LE BRASIER', 'L’ÉCLAIR'];

// Niveau d'apparition de chaque type de passage (tout est disponible dès le chapitre 3)
const UNLOCK = { spk: 0, gap: 0, spk2: 0, spkL: 1, sawrow: 2, plt: 2, saw: 3, gap2: 3, islands: 4, wal: 5, combo: 5, stairs: 7, wal2: 9, mpl: 10, fsaw: 11, pad: 12, combo3: 13, orb: 15, msaw: 16, ceil: 18, zig: 19, bed: 20 };
const NEWSIGN = {
  spkL: 'LONGUES PIQUES : DOUBLE SAUT', sawrow: 'SCIES EN SÉRIE', plt: 'PLATEFORME : POSE-TOI DESSUS', saw: 'SCIE : SAUTE PAR-DESSUS',
  gap2: 'GRAND TROU : DOUBLE SAUT', islands: 'ÎLOTS : ATTERRIS PILE', wal: 'MUR : PASSE PAR L’OUVERTURE', stairs: 'ESCALIER', wal2: 'DOUBLE MUR',
  mpl: 'PLATEFORME MOBILE', fsaw: 'SCIE HAUTE : NE SAUTE PAS', pad: 'TREMPLIN : LAISSE-TOI PORTER', orb: 'ORBE : RECHARGE TON DOUBLE SAUT',
  msaw: 'SCIE MOBILE : TROUVE LE TEMPO', ceil: 'PLAFOND BAS : RESTE AU SOL', zig: 'PLAFOND + PIQUES', bed: 'LIT DE PIQUES',
};

// Mode hardcore : départ déjà nerveux, gros palier après chaque boss, boss long et brutal
const CH_D = [.3, .55, .7, .8, .86, .9, .93, .96, .98, 1];
function storyParams(i) {
  const w = Math.floor(i / 10), k = i % 10, boss = k === 9;
  let d = CH_D[w] + k * .02;
  let rest = Math.max(.15, .9 * Math.pow(.72, w) - k * .04);
  let sp = 6.2 + w * .32 + k * .03;
  let dur = 13 + w * 1.4 + k * .3;
  if (boss) { d += .15; rest *= .5; sp += .4; dur = Math.min(60, dur * 2.6); }
  const name = boss ? BOSS[w] : `${w + 1}-${k + 1}`;
  return { mode: 'story', i, w, boss, d: clamp(d, 0, 1), rest, sp: +sp.toFixed(2), bpm: WORLDS[w].bpm, dur, name, lvlEq: i, comboW: (.8 + w * .4) * (boss ? 2.2 : 1) };
}

// ── PASSAGES (chunks) ────────────────────────────────────────────
// c = { sp, d, R1 (portée d'un saut simple), B (unités par temps), r (aléatoire), q (quantification) }
const CH = {
  spk(x, c) {
    const n = Math.max(2, Math.round(c.R1 * lerp(.15, .7, c.d * (.3 + .7 * c.r())) / 22));
    return { obs: [{ t: 'spk', x, w: n * 22 }], end: x + n * 22 };
  },
  spkL(x, c) {
    const n = Math.max(6, Math.round(c.R1 * lerp(.85, 1.3, c.d * c.r()) / 22));
    return { obs: [{ t: 'spk', x, w: n * 22 }], end: x + n * 22 };
  },
  sawrow(x, c) {
    const n = 2 + Math.floor(c.r() * (1 + c.d * 2.5)), ob = []; let cx = x;
    for (let k = 0; k < n; k++) { const s = CH.saw(cx, c); ob.push(...s.obs); cx = c.q(s.end + c.R1 * lerp(.75, .5, c.d)); }
    return { obs: ob, end: ob[ob.length - 1].x + ob[ob.length - 1].r };
  },
  islands(x, c) {
    const n = 2 + Math.floor(c.r() * (1 + c.d * 2)), gaps = []; let cx = x;
    for (let k = 0; k < n; k++) { const w = Math.round(c.R1 * lerp(.35, .6, c.d * c.r())); gaps.push({ x: cx, w }); cx += w + Math.round(lerp(90, 46, c.d)); }
    return { obs: [], gaps, end: cx - Math.round(lerp(90, 46, c.d)) };
  },
  stairs(x, c) {
    const n = 3 + Math.floor(c.r() * 2), pw = Math.round(lerp(110, 80, c.d)), step = Math.round(c.R1 * lerp(.62, .72, c.d));
    const ob = [], W = step * n + pw;
    ob.push({ t: 'spk', x, w: Math.floor(W / 22) * 22 });
    for (let k = 0; k < n; k++) ob.push({ t: 'plt', x: Math.round(x + step * (k + .5)), y: G - Math.min(150, 55 + k * 30), w: pw, h: 14 });
    return { obs: ob, end: x + Math.floor(W / 22) * 22 };
  },
  wal2(x, c) {
    const a = CH.wal(x, c), b = CH.wal(c.q(x + c.R1 * lerp(.85, .6, c.d)), c);
    return { obs: a.obs.concat(b.obs), end: b.end };
  },
  zig(x, c) {
    const s1 = CH.spk(x, c), cl = CH.ceil(c.q(s1.end + c.R1 * .35), c);
    return { obs: s1.obs.concat(cl.obs), end: cl.end };
  },
  gap(x, c) {
    const w = Math.round(c.R1 * lerp(.3, .62, c.d * (.4 + .6 * c.r())));
    return { obs: [], gaps: [{ x, w }], end: x + w };
  },
  spk2(x, c) {
    const a = CH.spk(x, c), w = a.end - x;
    const b = CH.spk(c.q(x + Math.max(w + c.B * 1.5, c.R1 * 1.15)), c);
    return { obs: a.obs.concat(b.obs), end: b.end };
  },
  plt(x, c) {
    const w = Math.round(c.R1 * lerp(1.15, 1.5, c.d * c.r()));
    const pw = Math.round(lerp(170, 115, c.d)), h = Math.round(lerp(70, 115, .5 * c.r() + .5 * c.d));
    return { obs: [{ t: 'plt', x: Math.round(x + w / 2 - pw / 2), y: G - h, w: pw, h: 14 }], gaps: [{ x, w }], end: x + w };
  },
  saw(x, c) {
    const r = Math.round(lerp(24, 36, c.d * c.r()));
    return { obs: [{ t: 'saw', x: x + r, y: G - r + 6, r, sp: (c.r() < .5 ? 1 : -1) * lerp(.06, .12, c.d) }], end: x + 2 * r };
  },
  gap2(x, c) {
    const w = Math.round(c.R1 * lerp(.95, 1.25, c.d * c.r()));
    return { obs: [], gaps: [{ x, w }], end: x + w };
  },
  wal(x, c) {
    const low = c.r() < .3;
    const gh = Math.round(2 * PR + lerp(74, 40, c.d));
    const L = low ? 0 : Math.round(lerp(40, 115, c.r()));
    return { obs: [{ t: 'wal', x, gs: G - L - gh, gh }], end: Math.round(x + WALL_W + (L > 0 ? c.R1 * .3 : 0)) };
  },
  mpl(x, c) {
    const w = Math.round(c.R1 * lerp(1.2, 1.5, c.d * c.r()));
    const pw = Math.round(lerp(150, 105, c.d)), mi = G - 150, ma = G - 55;
    const sp = lerp(1.1, 2.2, c.d) * (c.r() < .5 ? 1 : -1);
    return { obs: [{ t: 'mpl', x: Math.round(x + w / 2 - pw / 2), y: Math.round(lerp(mi, ma, c.r())), w: pw, h: 14, mi, ma, sp }], gaps: [{ x, w }], end: x + w };
  },
  fsaw(x, c) {
    const r = Math.round(lerp(26, 34, c.r())), lift = c.d < .5 ? 46 : 30;
    const ob = []; let sx = x;
    if (c.d > .45 && c.r() < .6) { const s = CH.spk(x, c); ob.push(...s.obs); sx = c.q(x + c.R1 * 1.1); }
    ob.push({ t: 'saw', x: sx + r, y: G - 2 * PR - lift - r, r, sp: -.09 });
    return { obs: ob, end: sx + 2 * r };
  },
  pad(x, c) {
    const pw = 40, ta = PADV / GRAV;
    const ay = G - PR - (PADV * PADV / (2 * GRAV) - PADV / 2);
    const gh = Math.round(2 * PR + lerp(92, 58, c.d));
    const wx = Math.round(x + pw / 2 + c.sp * ta - WALL_W / 2);
    return { obs: [{ t: 'pad', x, w: pw }, { t: 'wal', x: wx, gs: Math.round(ay - gh / 2), gh }], end: Math.round(wx + WALL_W + c.sp * 22) };
  },
  orb(x, c) {
    const w = Math.round(c.R1 * lerp(1.55, 1.85, c.d * c.r()));
    return { obs: [{ t: 'orb', x: Math.round(x + w * .5), y: G - 120 }], gaps: [{ x, w }], end: x + w };
  },
  msaw(x, c) {
    const r = Math.round(lerp(26, 32, c.r()));
    return { obs: [{ t: 'msaw', x: x + r, y: G - r + 6, r, amp: Math.round(lerp(70, 90, c.r())), fr: lerp(.035, .055, c.d), ph: c.r() * 6.28, sp: .1 }], end: x + 2 * r };
  },
  ceil(x, c) {
    const w = Math.round(lerp(140, 300, c.d * c.r()));
    const cl = Math.round(2 * PR + lerp(40, 18, c.d));
    const ob = [{ t: 'ceil', x, w, cl }]; let end = x + w;
    if (c.d > .35 && c.r() < .7) { const s = CH.spk(c.q(end + c.B * .5), c); ob.push(...s.obs); end = s.end; }
    return { obs: ob, end };
  },
  bed(x, c) {
    const n = Math.max(4, Math.round(c.R1 * lerp(1.5, 2.2, c.d * c.r()) / 22)), W = n * 22;
    const np = W > c.R1 * 1.7 ? 2 : 1, ob = [{ t: 'spk', x, w: W }];
    for (let k = 0; k < np; k++) {
      const pw = Math.round(lerp(120, 92, c.d)), cxp = x + W * (k + 1) / (np + 1);
      ob.push({ t: 'plt', x: Math.round(cxp - pw / 2), y: G - Math.round(lerp(75, 100, c.r())), w: pw, h: 14 });
    }
    return { obs: ob, end: x + W };
  },
  combo3(x, c) {
    const a = CH.combo(x, c);
    const b = CH.combo(c.q(a.end + Math.max(c.B * 1.2, c.R1 * .8)), c);
    return { obs: a.obs.concat(b.obs), gaps: (a.gaps || []).concat(b.gaps || []), end: b.end };
  },
  combo(x, c) {
    const pool = ['spk', 'gap', 'saw', 'wal', 'msaw', 'fsaw', 'gap2', 'ceil', 'spkL', 'sawrow', 'islands', 'plt', 'mpl'].filter(t => !c.unl || c.unl.includes(t));
    const a = CH[pool[Math.floor(c.r() * pool.length)]](x, c);
    const b = CH[pool[Math.floor(c.r() * pool.length)]](c.q(a.end + Math.max(c.B * lerp(1.5, .9, c.d), c.R1 * lerp(.9, .55, c.d))), c);
    return { obs: a.obs.concat(b.obs), gaps: (a.gaps || []).concat(b.gaps || []), end: b.end };
  },
};

function pickChunk(rng, lvlEq, last, comboW) {
  const types = Object.keys(UNLOCK).filter(t => UNLOCK[t] <= lvlEq);
  const ws = types.map(t => {
    let w = 1;
    if (t === 'spk' || t === 'gap') w = lvlEq < 10 ? 1.6 : .8;
    if (lvlEq - UNLOCK[t] < 4 && UNLOCK[t] > 0) w = 2.4;
    if ((t === 'combo' || t === 'combo3') && comboW) w = comboW;
    if (t === last) w *= .25;
    return w;
  });
  let s = ws.reduce((a, b) => a + b, 0) * rng();
  for (let k = 0; k < types.length; k++) { s -= ws[k]; if (s <= 0) return types[k]; }
  return types[0];
}

function chunkCtx(rng, sp, d, bpm) {
  const B = sp * 3600 / bpm, R1 = sp * 2 * JV / GRAV;
  return { sp, d, B, R1, r: rng, q: x => Math.round(x / (B / 2)) * (B / 2) };
}

function finalize(L) {
  L.obs.sort((a, b) => a.x - b.x);
  for (const o of L.obs) {
    o.x0 = o.t === 'saw' || o.t === 'msaw' ? o.x - o.r : o.t === 'orb' ? o.x - ORB_R : o.x;
    o.x1 = o.t === 'saw' || o.t === 'msaw' ? o.x + o.r : o.t === 'orb' ? o.x + ORB_R : o.t === 'wal' ? o.x + WALL_W : o.t === 'sign' ? o.x : o.x + o.w;
  }
  L.gaps.sort((a, b) => a.x - b.x);
  L.ci = 0; L.gi = 0;
  return L;
}

// ── NIVEAU HISTOIRE ──────────────────────────────────────────────
function genStory(i, fix) {
  const p = storyParams(i);
  if (fix === undefined) fix = (typeof SEEDFIX !== 'undefined' && SEEDFIX[i]) || 0;
  const rng = rngOf(hashStr('BOLT' + i + '_' + fix));
  let c = chunkCtx(rng, p.sp, p.d, p.bpm);
  c.unl = Object.keys(UNLOCK).filter(t => UNLOCK[t] <= i);
  const len = Math.round(p.sp * 60 * p.dur);
  const L = { ...p, len, obs: [], gaps: [] };
  // Boss : la seconde moitié accélère de 12 %
  L.spAt = p.boss ? (x => x > len / 2 ? p.sp * 1.12 : p.sp) : (() => p.sp);
  let phase2 = false;
  let x = c.q(c.B * 4), last = null, first = true;
  const fresh = Object.keys(NEWSIGN).find(t => UNLOCK[t] === i);
  if (i === 0) L.obs.push({ t: 'sign', x: 60, txt: 'TAPE OU ESPACE : SAUT' });
  if (i === 1) L.obs.push({ t: 'sign', x: 60, txt: 'MAINTIENS : SAUT PLUS HAUT' });
  if (i === 2) L.obs.push({ t: 'sign', x: 60, txt: 'RE-TAPE EN L’AIR : DOUBLE SAUT' });
  while (x < len - c.B * 4) {
    let type = first && fresh ? fresh : pickChunk(rng, p.lvlEq, last, p.comboW);
    if (first && fresh) L.obs.push({ t: 'sign', x: Math.round(x - c.B * 2.5), txt: NEWSIGN[fresh] });
    const res = CH[type](x, c);
    if (res.end > len - c.B * 2) break;
    L.obs.push(...res.obs); if (res.gaps) L.gaps.push(...res.gaps);
    if (p.boss && !phase2 && x > len / 2) { phase2 = true; const u = c.unl; c = chunkCtx(rng, p.sp * 1.12, Math.min(1, p.d + .05), p.bpm); c.unl = u; }
    const rest = p.rest * (1 + rng() * .45);
    x = c.q(res.end + Math.max(rest * c.B, c.R1 * Math.max(.28, .45 - p.w * .03)));
    last = type; first = false;
  }
  return finalize(L);
}

// ── ENDLESS (flux infini) ────────────────────────────────────────
function endlessSp(x) { return 6.5 + 2.6 * Math.min(1, x / 40000) + 1 * clamp((x - 40000) / 60000, 0, 1); }
function endlessD(x) { return Math.min(1, .25 + x / 25000); }
function newEndless(seed, daily) {
  const L = { mode: daily ? 'daily' : 'endless', i: -1, w: 0, boss: false, sp: 6.5, bpm: 132, len: Infinity, obs: [], gaps: [], ci: 0, gi: 0,
    name: daily ? 'DÉFI DU JOUR' : 'ENDLESS', spAt: endlessSp, rng: rngOf(seed), gx: 0, last: null };
  L.gx = 3 * 6.5 * 3600 / 132;
  extendEndless(L, 2500);
  return L;
}
function extendEndless(L, upto) {
  let added = false;
  while (L.gx < upto) {
    const sp = endlessSp(L.gx), d = endlessD(L.gx), lvlEq = Math.min(99, 2 + d * 25);
    const c = chunkCtx(L.rng, sp, d, L.bpm);
    c.unl = Object.keys(UNLOCK).filter(t => UNLOCK[t] <= lvlEq);
    const type = pickChunk(L.rng, lvlEq, L.last, .8 + d * 2.5);
    const res = CH[type](c.q(L.gx), c);
    for (const o of res.obs) L.obs.push(o);
    if (res.gaps) for (const g of res.gaps) L.gaps.push(g);
    L.gx = res.end + Math.max(lerp(1.1, .25, d) * c.B * (1 + L.rng() * .5), c.R1 * lerp(.45, .3, d));
    L.last = type; added = true;
  }
  if (added) {
    finalize(L);
  }
}
function pruneEndless(L, x) {
  const cut = x - 1500;
  let n = 0; while (n < L.obs.length && L.obs[n].x1 < cut) n++;
  if (n > 0) { L.obs.splice(0, n); L.ci = 0; }
  let m = 0; while (m < L.gaps.length && L.gaps[m].x + L.gaps[m].w < cut) m++;
  if (m > 0) { L.gaps.splice(0, m); L.gi = 0; }
}

// ── PHYSIQUE (pas fixe, déterministe) ────────────────────────────
function newPlayer(x) {
  return { x: x || 0, y: G - PR, vy: 0, air: 1, onG: true, coy: 0, buf: 0, rising: false, plat: -1, orbs: '' };
}
function clonePlayer(P) { return { x: P.x, y: P.y, vy: P.vy, air: P.air, onG: P.onG, coy: P.coy, buf: P.buf, rising: P.rising, plat: P.plat, orbs: P.orbs }; }

const mplY = (o, t) => tri(o.y + o.sp * t, o.mi, o.ma);
const msawY = (o, t) => o.y - o.amp * (.5 - .5 * Math.cos(t * o.fr + o.ph));

function inGap(L, x) {
  const g = L.gaps; let i = L.gi;
  while (i > 0 && g[i - 1].x + g[i - 1].w > x - 50) i--;
  while (i < g.length && g[i].x + g[i].w < x - 50) i++;
  L.gi = i;
  for (let k = i; k < g.length && g[k].x < x + 50; k++)
    if (x - PR * .6 >= g[k].x && x + PR * .6 <= g[k].x + g[k].w) return true;
  return false;
}

function spikeHit(o, x, y) {
  const n = Math.max(1, Math.round(o.w / 22)), sw = o.w / n;
  for (const dx of [-.55 * PR, -.25 * PR, 0, .25 * PR, .55 * PR]) {
    const px = x + dx;
    if (px < o.x || px > o.x + o.w) continue;
    const loc = ((px - o.x) % sw) / sw;
    const h = SPK_H * (1 - Math.abs(loc - .5) * 2);
    const bot = y + Math.sqrt(PR * PR - dx * dx) * .82;
    if (bot > G - h + 3) return true;
  }
  return false;
}

// Un pas de simulation. Renvoie '' | 'jump' | 'djump' | 'pad' | 'orb' | 'win' | 'die:<type>'
function step(L, P, t, press, down) {
  const sp = L.spAt(P.x);
  let ev = '';
  if (press) P.buf = BUFFER;
  if (P.buf > 0) {
    if (P.onG || P.coy > 0) { P.vy = -JV; P.onG = false; P.coy = 0; P.buf = 0; P.rising = true; P.plat = -1; ev = 'jump'; }
    else if (P.air > 0) { P.vy = -JV2; P.air--; P.buf = 0; P.rising = true; ev = 'djump'; }
    else P.buf--;
  }
  if (P.rising && !down && P.vy < 0) { P.vy *= JCUT; P.rising = false; }
  if (P.vy >= 0) P.rising = false;

  const prevB = P.y + PR, wasG = P.onG, wasPlat = P.plat;
  P.x += sp; P.vy = Math.min(P.vy + GRAV, MAXVY); P.y += P.vy;
  P.onG = false; P.plat = -1;

  // sol
  if (P.y + PR >= G && !inGap(L, P.x)) {
    if (prevB <= G + 1) { P.y = G - PR; P.vy = 0; P.onG = true; }
    else return 'die:edge';
  }

  // obstacles proches
  const O = L.obs;
  while (L.ci > 0 && O[L.ci - 1].x0 > P.x - 1400) L.ci--;
  while (L.ci < O.length && O[L.ci].x0 < P.x - 1400) L.ci++;
  for (let k = L.ci; k < O.length; k++) {
    const o = O[k];
    if (o.x0 > P.x + 60) break;
    if (o.x1 < P.x - 60) continue;
    switch (o.t) {
      case 'plt': case 'mpl': {
        if (P.x + PR * .7 > o.x && P.x - PR * .7 < o.x + o.w) {
          const py = o.t === 'mpl' ? mplY(o, t) : o.y, ppy = o.t === 'mpl' ? mplY(o, t - 1) : o.y;
          const b = P.y + PR;
          if (P.vy >= 0 && ((b >= py && prevB <= ppy + 2) || (wasPlat === k && b >= py - 6 && b <= py + 20))) {
            P.y = py - PR; P.vy = 0; P.onG = true; P.plat = k;
          }
        }
        break;
      }
      case 'spk': if (spikeHit(o, P.x, P.y)) return 'die:spk'; break;
      case 'saw': { const dx = P.x - o.x, dy = P.y - o.y; if (dx * dx + dy * dy < (PR + o.r - 9) ** 2) return 'die:saw'; break; }
      case 'msaw': { const dx = P.x - o.x, dy = P.y - msawY(o, t); if (dx * dx + dy * dy < (PR + o.r - 9) ** 2) return 'die:saw'; break; }
      case 'wal':
        if (P.x + PR * .8 > o.x && P.x - PR * .8 < o.x + WALL_W)
          if (!(P.y - PR * .85 >= o.gs && P.y + PR * .85 <= o.gs + o.gh)) return 'die:wal';
        break;
      case 'ceil':
        if (P.x + PR * .8 > o.x && P.x - PR * .8 < o.x + o.w && P.y - PR * .85 < G - o.cl) return 'die:ceil';
        break;
      case 'orb':
        if (P.air === 0 && !P.orbs.includes('|' + o.x + ';')) {
          const dx = P.x - o.x, dy = P.y - o.y;
          if (dx * dx + dy * dy < (PR + ORB_R) ** 2) { P.air = 1; P.orbs += '|' + o.x + ';'; ev = 'orb'; }
        }
        break;
    }
  }

  if (P.onG) {

const Snd = (() => {

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    if (hp) { const f = A.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; n.connect(f); n = f; }
    if (lp) { const f = A.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; n.connect(f); n = f; }

  // ── motif musical déterministe par niveau ──
  function makePattern(seed, world, boss) {
    const r = rngOf(seed);
    const W = WORLDS[world] || WORLDS[0];
    const scale = W.minor ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];
    const progs = W.minor ? [[0, 5, 3, 4], [0, 3, 5, 4], [0, 6, 5, 4], [0, 4, 5, 3]] : [[0, 4, 5, 3], [0, 5, 3, 4], [0, 3, 4, 4]];
    const prog = progs[Math.floor(r() * progs.length)];

          for (; i < end; i++) playStep(pat, bpm, i, i * sd, off.destination);

    if (!pr) return null;

    S,
    unlock() { ctx(); },
    setVol(v) { S.vol = v; if (master) master.gain.value = v; },
    // Prépare la boucle d'un niveau à l'avance (pendant l'écran de fin du précédent)
    prepare(seed, bpm, world, boss) { if (S.music && ac) entry(seed, bpm, world, boss); },
    start(seed, bpm, world, boss, offsetSec = 0) {

      };
      const e = entry(seed, bpm, world, boss);
      if (!e) return live(seed, bpm, world, boss, offsetSec);
      if (e.buf) return play(e.buf);
      e.pr.then(play, () => { if (my === tok) live(seed, bpm, world, boss, offsetSec + ac.currentTime - asked); });
    },
    stop(now) {
      tok++;
      clearInterval(timer); timer = 0;

    mode() { return src ? 'boucle' : seq ? 'direct' : ''; },

const TAU = Math.PI * 2;

function ball(c, r, c1, c2, c3) {
  const g = c.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
  g.addColorStop(0, c1); g.addColorStop(.55, c2); g.addColorStop(1, c3);

}

function eyes(c, r, col, look = 0, angry = false) {
  for (const s of [-1, 1]) {
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(s * r * .34, -r * .12, r * .22, r * .27, 0, 0, TAU); c.fill();
    c.fillStyle = col; c.beginPath(); c.arc(s * r * .34 + r * .08 + look, -r * .08, r * .11, 0, TAU); c.fill();

  }
}

  c.beginPath();

  c.closePath();
}

// Chaque motif dessine la balle centrée en (0,0). spin = rotation de roulement.

  },
  eyes(c, r, k, t) { ball(c, r, ...k.c); eyes(c, r, k.x || '#111', Math.sin(t * 2) * r * .05); },
  angry(c, r, k) { ball(c, r, ...k.c); eyes(c, r, '#111', 0, true); },

    c.beginPath(); c.arc(0, 0, r * .7, 0, TAU); c.stroke(); for (let i = 0; i < 12; i++) { const a = i * TAU / 12; c.beginPath(); c.moveTo(Math.cos(a) * r * .6, Math.sin(a) * r * .6); c.lineTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8); c.stroke(); }
    c.restore();
  },
};

function drawSkin(c, sk, r, t, spin) {
  if (sk.g) {
    const g = c.createRadialGradient(0, 0, r * .3, 0, 0, r * 2.1);
    g.addColorStop(0, sk.g); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 2.1, 0, TAU); c.fill();
  }
  c.save();
  (PAT[sk.p] || PAT.grad)(c, r, sk, t, spin);
  c.restore();
}
function trailColor(sk, i, t) {
  switch (sk.tr) {
    case 'rainbow': return `hsl(${(i * 25 + t * 200) % 360},100%,60%)`;
    case 'fire': return i % 2 ? '#ffcc33' : '#ff4400';
    case 'ice': return '#bff4ff';
    case 'dark': return '#000';
    case 'gold': return '#ffd84a';
    default: return sk.tc || sk.c[1];
  }
}

// ▼▼▼ À REMPLIR pour activer le classement mondial (voir supabase-setup.sql) ▼▼▼
const LB_URL = '';   // ex : 'https://abcdefgh.supabase.co'
const LB_KEY = '';   // clé "anon public" du projet Supabase
// ▲▲▲

const SAVE_KEY = 'boltball_v2';
const Save = {
  d: null,
  fresh() {
    return {
      v: 2, name: '', pid: 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36),
      skin: 'base', ach: {}, lv: {}, fl: {},
      set: { music: true, sfx: true, vol: .8, flash: true, shake: true },
      st: { deaths: 0, dt: {}, jumps: 0, djumps: 0, orbs: 0, pads: 0, restarts: 0, pauses: 0, skinChanges: 0, playSec: 0,
        days: [], dailyDays: [], endRuns: 0, endDist: 0, endBest: 0, dailyBestEver: 0, daily: {}, shares: 0, practiceDone: 0, fastDeaths: 0 },
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { }
    const f = this.fresh();
    if (!d || d.v !== 2) {
      d = f;
      try { const n = localStorage.getItem('bb_n'); if (n) d.name = n; } catch (e) { }
    } else {
      for (const k in f) if (d[k] === undefined) d[k] = f[k];
      for (const k in f.st) if (d.st[k] === undefined) d.st[k] = f.st[k];
      for (const k in f.set) if (d.set[k] === undefined) d.set[k] = f.set[k];
    }
    this.d = d;
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.d)); } catch (e) { } },
  reset() { const n = this.d.name, pid = this.d.pid; this.d = this.fresh(); this.d.name = n; this.d.pid = pid; this.save(); },
};

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

const LB = {
  online: () => !!(LB_URL && LB_KEY),
  headers() { return { apikey: LB_KEY, Authorization: 'Bearer ' + LB_KEY, 'Content-Type': 'application/json' }; },
  // mode : 'endless' | 'daily' | 'story' ; score : plus grand = meilleur
  async submit(mode, day, score, deaths, extra) {
    if (!this.online() || !Save.d.name) return false;
    try {
      const body = [{ player_id: Save.d.pid, name: Save.d.name.slice(0, 12), mode, day: day || 'all', score: Math.round(score), deaths: Math.round(deaths || 0), extra: Math.round(extra || 0) }];
      const r = await fetch(`${LB_URL}/rest/v1/scores?on_conflict=player_id,mode,day`, { method: 'POST', headers: { ...this.headers(), Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(body) });
      return r.ok;
    } catch (e) { return false; }
  },
  async top(mode, day, n = 50) {
    if (!this.online()) return null;
    try {
      const q = `select=player_id,name,score,deaths,extra&mode=eq.${mode}&day=eq.${encodeURIComponent(day || 'all')}&order=score.desc,deaths.asc&limit=${n}`;
      const r = await fetch(`${LB_URL}/rest/v1/scores?${q}`, { headers: this.headers() });
      if (!r.ok) return null; return await r.json();
    } catch (e) { return null; }
  },
  async rank(mode, day, score) {
    if (!this.online()) return null;
    try {
      const q = `select=player_id&mode=eq.${mode}&day=eq.${encodeURIComponent(day || 'all')}&score=gt.${Math.round(score)}`;
      const r = await fetch(`${LB_URL}/rest/v1/scores?${q}`, { headers: { ...this.headers(), Prefer: 'count=exact', Range: '0-0' } });
      const cr = r.headers.get('content-range'); if (!cr) return null;
      return +cr.split('/')[1] + 1;
    } catch (e) { return null; }
  },
};

// ════════════════════════════════════════════════════════════════
//  JEU : boucle, rendu, interface
// ════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d', { alpha: false });
let DPRCAP = 2; // baisse automatiquement si l'appareil ne tient pas 60 images/s
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0, VWV = VW, PXV = PX;

function resize() {
  DPR = Math.min(DPRCAP, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  const cw = Math.round(W * DPR), ch = Math.round(H * DPR);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; } // ne réalloue que si la taille change
  view(Game.L ? Game.vsp : 6.2);
}
// En portrait, la vue s'élargit avec la vitesse pour garder le même temps de réaction
function view(sp) {
  const portrait = H > W;
  VWV = portrait ? clamp(420 + (sp - 6.2) * 45, 420, 600) : VW; PXV = portrait ? VWV * .2 : PX;
  SC = Math.min(H / VH, W / VWV); OX = (W - VWV * SC) / 2; OY = (H - VH * SC) * (portrait ? .58 : .5);
}

// ── ÉTAT ─────────────────────────────────────────────────────────
const Game = {
  state: 'menu', mode: '', L: null, P: null, t: 0, acc: 0, last: 0,
  lvl: 0, deaths: 0, attempt: 1, practice: false, cp: null, cps: [],
  rec: [], cur: null, parts: [], trail: [], shake: 0, spin: 0, sx: 1, sy: 1,
  dieT: 0, dieType: '', usedDj: false, rt: 0, seed: 0, day: '', worldVis: 0, msg: null,
  px: 0, py: 0, vsp: 6.2, hit: 0, dieAge: 0, marks: [], pops: [], bestX: 0, passedBest: false,
  coins: 0, m100: 0, ph2: false, countT: 0,
};
let PULSE = 0; // battement de la musique (1 sur le temps, retombe vers 0)
const Inp = { down: false, queued: false };

// ── OUTILS ───────────────────────────────────────────────────────
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function curSkin() { return skinById(Save.d.skin); }
function W0() { return WORLDS[Game.L ? Game.L.w : 0] || WORLDS[0]; }
const D = () => Save.d;

// ── SILHOUETTES DE DÉCOR (parallaxe) ─────────────────────────────
const SILC = {};
function silPath(w, layer) {
  const k = w + ':' + layer; if (SILC[k]) return SILC[k];
  const type = WORLDS[w].sil, r = rngOf(hashStr(k)), per = 1600, p = new Path2D();
  const amp = layer ? 1 : .6, base = G;
  const wave = (fs) => { p.moveTo(0, base); for (let x = 0; x <= per; x += 20) { let h = 0; for (const [a, f, ph] of fs) h += a * Math.sin(x / per * TAU * f + ph); p.lineTo(x, base - (60 + h) * amp - (layer ? 0 : 50)); } p.lineTo(per, base); p.closePath(); };
  const ph = () => r() * 6.28;
  switch (type) {
    case 'hills': wave([[40, 2, ph()], [20, 5, ph()], [8, 11, ph()]]); break;
    case 'waves': wave([[25, 4, ph()], [15, 9, ph()], [6, 17, ph()]]); break;
    case 'dunes': wave([[50, 1, ph()], [25, 3, ph()]]); break;
    case 'peaks': { p.moveTo(0, base); let x = 0; while (x < per) { const w2 = 80 + r() * 160, h = (90 + r() * 140) * amp; p.lineTo(x + w2 / 2, base - h - (layer ? 0 : 40)); x += w2; p.lineTo(Math.min(per, x), base - 30 * amp); } p.lineTo(per, base); p.closePath(); break; }
    case 'teeth': case 'flames': { p.moveTo(0, base); let x = 0; while (x < per) { const w2 = type === 'teeth' ? 50 : 26 + r() * 30, h = (type === 'teeth' ? 70 : 40 + r() * 110) * amp + (layer ? 0 : 40); p.lineTo(x + w2 / 2, base - h); x += w2; p.lineTo(Math.min(per, x), base - (type === 'teeth' ? 30 : 20) * amp); } p.lineTo(per, base); p.closePath(); break; }
    case 'towers': case 'factory': { let x = 0; while (x < per) { const w2 = 40 + r() * 90, h = (60 + r() * 170) * amp + (layer ? 0 : 50); p.rect(x, base - h, w2, h); if (type === 'factory' && r() < .5) p.rect(x + w2 * .3, base - h - 50, 14, 50); if (type === 'towers' && r() < .6) p.rect(x + w2 / 2 - 2, base - h - 40, 4, 40); x += w2 + 10 + r() * 50; } break; }
    case 'cubes': for (let i = 0; i < 14; i++) { const s = (16 + r() * 50) * amp; p.rect(r() * per, 40 + r() * 230, s, s); } break;
    case 'bolts': for (let i = 0; i < 7; i++) { const x = r() * per, y = 30 + r() * 80, s = (.6 + r() * .8) * amp; p.moveTo(x, y); p.lineTo(x - 30 * s, y + 90 * s); p.lineTo(x - 6 * s, y + 90 * s); p.lineTo(x - 26 * s, y + 180 * s); p.lineTo(x + 30 * s, y + 70 * s); p.lineTo(x + 6 * s, y + 70 * s); p.closePath(); } break;
  }
  return SILC[k] = p;
}

// ── RENDU ────────────────────────────────────────────────────────
function lowerObs(L, x) { let lo = 0, hi = L.obs.length; while (lo < hi) { const m = lo + hi >> 1; if (L.obs[m].x0 < x) lo = m + 1; else hi = m; } return lo; }

// Fond : le dégradé est peint une seule fois dans une image de la taille de l'écran,
// puis recopié tel quel à chaque image (bien moins coûteux qu'un dégradé plein écran recalculé)
let BGI = null, BGW = -1;
function drawBg(w, camX, tm) {
  if (BGW !== w || !BGI || BGI.width !== cv.width || BGI.height !== cv.height) {
    if (!BGI) BGI = document.createElement('canvas');
    BGI.width = cv.width; BGI.height = cv.height;
    const g = BGI.getContext('2d', { alpha: false }), gr = g.createLinearGradient(0, 0, 0, cv.height);
    gr.addColorStop(0, WORLDS[w].c1); gr.addColorStop(1, WORLDS[w].c2); g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
    BGW = w;
  }
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.drawImage(BGI, 0, 0);
}
function drawSil(w, camX) {
  const Wd = WORLDS[w];
  for (const [layer, f, a] of [[0, .12, .07], [1, .35, .13]]) {
    const p = silPath(w, layer), off = -((camX * f) % 1600);
    cx.fillStyle = rgba(Wd.ed, a + .02 * PULSE);
    cx.save(); cx.translate(off, 0); cx.fill(p); if (off + 1600 < VWV + 2) { cx.translate(1600, 0); cx.fill(p); } cx.restore();
  }
}

function worldTf(shx = 0, shy = 0) { cx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + shx * SC), DPR * (OY + shy * SC)); }

function drawWorld(L, camX, t, tm, opts = {}) {
  const Wd = WORLDS[L.w] || WORLDS[0], top = -OY / SC - 20, bot = (H - OY) / SC + 20;
  // étoiles + décors
  cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath();
  for (let i = 0; i < 46; i++) { const x = ((i * 173.3 - camX * .04) % VWV + VWV) % VWV, y = top + ((i * 97.7) % (G - top - 60)); cx.rect(x, y, i % 5 ? 1.2 : 2, i % 5 ? 1.2 : 2); }
  cx.fill();
  drawSil(L.w, camX);
  // lignes de vitesse
  const spd = opts.sp || 0;
  if (spd > 6.8) {
    cx.fillStyle = `rgba(255,255,255,${Math.min(.15, (spd - 6.8) * .05)})`;
    cx.beginPath();
    for (let i = 0; i < 9; i++) { const x = VWV + 60 - ((camX * 1.7 + i * 157) % (VWV + 200)), y = top + 30 + ((i * 71.3) % (G - top - 70)); cx.rect(x, y, 50 + (i % 3) * 35, 1.5); }
    cx.fill();
  }
  // grille de vitesse
  cx.strokeStyle = rgba(Wd.ed, .07); cx.lineWidth = 1; cx.beginPath();
  for (let x = -((camX * .6) % 80); x < VWV; x += 80) { cx.moveTo(x, top); cx.lineTo(x, G); }
  cx.stroke();

  cx.save(); cx.translate(-camX, 0);
  const x0 = camX - 60, x1 = camX + VWV + 60;
  // sol
  let sx = x0;
  const drawSeg = (a, b) => {
    if (b <= a) return;
    cx.fillStyle = Wd.gr; cx.fillRect(a, G, b - a, bot - G);
    cx.fillStyle = Wd.ed; cx.fillRect(a, G, b - a, 3);
    if (PULSE > .05) { cx.fillStyle = `rgba(255,255,255,${.22 * PULSE})`; cx.fillRect(a, G, b - a, 3); } // le liseré s'éclaircit sur le temps, sans changer de taille
    cx.fillStyle = rgba(Wd.ed, .12); cx.beginPath();
    for (let gx = Math.ceil(a / 64) * 64; gx < b; gx += 64) cx.rect(gx, G + 3, 1, bot - G);
    cx.fill();
  };
  for (const gp of L.gaps) {
    if (gp.x + gp.w < x0) continue; if (gp.x > x1) break;
    drawSeg(sx, gp.x); sx = gp.x + gp.w;
    cx.fillStyle = rgba(Wd.ob, .18); cx.fillRect(gp.x, G + 2, gp.w, bot - G);
  }
  drawSeg(sx, x1);

  // ligne d'arrivée
  if (isFinite(L.len) && L.len < x1 + 40) {
    const fx = L.len;
    cx.strokeStyle = `hsl(${tm * 120 % 360},100%,60%)`; cx.lineWidth = 3; cx.setLineDash([12, 7]);
    cx.beginPath(); cx.moveTo(fx, top); cx.lineTo(fx, G); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = '#ddd'; cx.fillRect(fx - 2, G - 130, 4, 130);
    cx.fillStyle = Wd.ac; cx.beginPath(); cx.moveTo(fx + 2, G - 130); cx.lineTo(fx + 40, G - 116); cx.lineTo(fx + 2, G - 102); cx.fill();
  }

  // ligne du record
  if (opts.bestX > 0 && opts.bestX > x0 && opts.bestX < x1) {
    cx.strokeStyle = 'rgba(255,216,74,.55)'; cx.lineWidth = 2; cx.setLineDash([5, 8]);
    cx.beginPath(); cx.moveTo(opts.bestX, top); cx.lineTo(opts.bestX, G); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = 'rgba(255,216,74,.8)'; cx.font = '900 11px "Arial Black",Arial'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('RECORD', opts.bestX, G - 210);
  }
  // croix aux endroits des morts précédentes
  if (opts.marks) {
    cx.strokeStyle = 'rgba(255,255,255,.4)'; cx.lineWidth = 2.5; cx.lineCap = 'round';
    for (const m of opts.marks) { if (m.x < x0 || m.x > x1) continue; cx.beginPath(); cx.moveTo(m.x - 6, m.y - 6); cx.lineTo(m.x + 6, m.y + 6); cx.moveTo(m.x + 6, m.y - 6); cx.lineTo(m.x - 6, m.y + 6); cx.stroke(); }
    cx.lineCap = 'butt';
  }
  // obstacles
  for (let k = lowerObs(L, x0 - 1400); k < L.obs.length; k++) {
    const o = L.obs[k]; if (o.x0 > x1) break; if (o.x1 < x0) continue;
    drawObs(o, t, Wd, top, tm, opts.P);
  }
  // checkpoints (entraînement)
  if (opts.cps) for (const c of opts.cps) {
    cx.fillStyle = '#39ff9a'; cx.save(); cx.translate(c.P.x, G - 46); cx.rotate(Math.PI / 4); cx.fillRect(-7, -7, 14, 14); cx.restore();
  }
  cx.restore();
}

function render(tm) {
  const st = Game.state;
  if (st === 'menu' || !Game.L) { PULSE = 0; drawMenuBg(tm); return; }
  if (st === 'done' && Game.rec.length) { renderReplay(tm); return; }
  const L = Game.L, P = Game.P, sk = curSkin();

  const k = st === 'play' ? clamp(Game.acc / DT, 0, 1) : 1;
  const rx = lerp(Game.px, P.x, k), ry = lerp(Game.py, P.y, k), rt = Game.t - 1 + k;
  const spNow = L.spAt(P.x);
  Game.vsp += (spNow - Game.vsp) * .04; view(Game.vsp);
  const ph = (rt / 60 * L.bpm / 60) % 1;
  PULSE = st === 'play' && D().set.music ? Math.pow(1 - ph, 3) : 0;
  const camX = rx - PXV;
  let shx = 0, shy = 0;
  if (Game.shake > .1 && D().set.shake) { shx = (Math.random() - .5) * Game.shake; shy = (Math.random() - .5) * Game.shake; }
  drawBg(L.w, camX, tm);
  worldTf(shx, shy);
  drawWorld(L, camX, rt, tm, { cps: Game.practice ? Game.cps : null, P, sp: spNow, bestX: Game.bestX, marks: Game.marks });
  cx.save(); cx.translate(-camX, 0);
  // numéro de l'essai, écrit dans le décor au départ
  if (L.mode === 'story' && Game.attempt > 1 && rx - Game.spawnX < 700 && !Game.practice) {
    cx.fillStyle = 'rgba(255,255,255,.28)'; cx.font = '900 30px "Arial Black",Arial'; cx.textAlign = 'left'; cx.textBaseline = 'middle';
    cx.fillText('ESSAI ' + Game.attempt, Game.spawnX + 40, G - 180);
  }
  // éclairs à ramasser
  if (L.mode === 'story') {
    const C = lvCoins(L.i), own = (D().lv[L.i] && D().lv[L.i].co) || 0;
    for (let i = 0; i < C.length / 2; i++) {
      if (Game.coins >> i & 1) continue;
      const x = C[2 * i]; if (x < camX - 40 || x > camX + VWV + 40) continue;
      drawBolt(x, C[2 * i + 1] + Math.sin(tm * 4 + i) * 3, 1, own >> i & 1 ? .3 : 1, tm + i);
    }
  }

      cx.beginPath(); cx.arc(P.x, P.y, PR + q * 90, 0, TAU); cx.stroke();
    }

  for (const p of Game.parts) { cx.globalAlpha = Math.max(0, Math.min(1, p.a)); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill(); }

  cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.lineJoin = 'round';
  for (const q of Game.pops) {
    cx.globalAlpha = Math.max(0, Math.min(1, q.a)); cx.font = `900 ${q.size}px "Arial Black",Arial`;
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,.7)'; cx.strokeText(q.txt, q.x, q.y); cx.fillStyle = q.col; cx.fillText(q.txt, q.x, q.y);
  }

  cx.restore();

    const n = Math.ceil(Game.countT / .5), f = (Game.countT / .5) % 1;
    cx.font = `900 ${Math.round(90 + 50 * f)}px "Arial Black",Arial`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = '#fff'; cx.shadowColor = '#ff3344'; cx.shadowBlur = 30; cx.fillText(String(Math.max(1, n)), W / 2, H * .42); cx.shadowBlur = 0;

// fond animé des menus
const menuL = { w: 0 };
function drawMenuBg(tm) {

  drawBg(w, 0, tm); worldTf();

  cx.fillStyle = Wd.ed; cx.fillRect(-OX / SC, G, VWV + 2 * OX / SC, 3);

// ── REPLAY DES MORTS (fin de niveau) ─────────────────────────────
function renderReplay(tm) {
  const L = Game.L, sk = curSkin();
  const maxN = Math.max(...Game.rec.map(r => r.n));
  Game.rt += 1.25; if (Game.rt > maxN + 90) Game.rt = 0;
  const t = Math.min(Math.floor(Game.rt), maxN);
  const x = L.sp * t, camX = x - PXV;
  drawBg(L.w, camX, tm); worldTf();
  drawWorld(L, camX, t, tm, {});
  cx.save(); cx.translate(-camX, 0);
  for (const r of Game.rec) {
    if (t <= r.n) {
      const y = r.ys[Math.max(0, t - 1)] / 4;
      if (r.win) drawBall(x, y, sk, tm, t * L.sp * .034);
      else drawBall(x, y, sk, tm, t * L.sp * .034, 1, 1, .32, PR * .9);
    } else if (!r.win && t - r.n < 25) {
      const y = r.ys[r.n - 1] / 4, xx = L.sp * r.n, a = 1 - (t - r.n) / 25;
      cx.strokeStyle = rgba(sk.c[1].length === 7 ? sk.c[1] : '#ff3333', a); cx.lineWidth = 3;
      cx.beginPath(); cx.arc(xx, y, PR + (t - r.n) * 1.5, 0, TAU); cx.stroke();
    }
  }
  cx.restore(); drawSides();
}

// ── BOUCLE ───────────────────────────────────────────────────────
const DT = 1 / 60;
// Les horloges des navigateurs (Safari surtout) sont arrondies : sans lissage, la durée mesurée de chaque image
// varie de ±1 ms et le défilement tremble. On cale donc la durée sur la cadence réelle de l'écran.
const FT = { buf: [], period: 1 / 60, drift: 0, k: 0 };

    for (const c of [1 / 120, 1 / 90, 1 / 60, 1 / 30]) if (Math.abs(p - c) < .0015) p = c;
    FT.period = p;
  }

  const sn = n * FT.period; FT.drift += el - sn;
  const c = FT.drift * .05; FT.drift -= c; // rattrape en douceur l'écart avec le temps réel
  return sn + c;

// Si l'appareil ne tient pas la cadence, on réduit la résolution de rendu par paliers (jamais en mode 30 images/s imposé)
const PF = { n: 0, sum: 0, at30: 0 };
function perfWatch(raw) {
  PF.n++; PF.sum += raw; if (Math.abs(raw - 1 / 30) < .003) PF.at30++;
  if (PF.n < 150) return;
  const avg = PF.sum / PF.n, capped30 = PF.at30 > PF.n * .8;
  PF.n = 0; PF.sum = 0; PF.at30 = 0;
  if (avg > .0205 && !capped30 && DPRCAP > 1.25 && (window.devicePixelRatio || 1) > 1.25) { DPRCAP = DPRCAP > 1.5 ? 1.5 : 1.25; resize(); }
}
function frame(now) {
  requestAnimationFrame(frame);
  const tm = now / 1000;
  if (!Game.last) Game.last = now;
  let el = (now - Game.last) / 1000; Game.last = now;
  if (el > .25) el = .25;
  if (Game.state === 'play' && el < .2) perfWatch(el);
  el = smoothDt(el);
  if (Game.state === 'play') {
    D().st.playSec += el;
    Game.acc += el;
    let n = 0;
    while (Game.acc >= DT && n < 6 && Game.state === 'play') { tick(); Game.acc -= DT; n++; }
    if (n === 6) Game.acc = 0;
  } else if (Game.state === 'clear') {
    const fw0 = Math.floor(Game.clearT / .22);
    Game.clearT += el; Game.P.x += Game.L.sp * 60 * el; Game.px = Game.P.x; Game.py = Game.P.y;
    if (Math.floor(Game.clearT / .22) > fw0 && Game.clearT < 1.3) burst(Game.P.x + 60 + Math.random() * (VWV * .6), 90 + Math.random() * 150, 18, ['#ffd84a', '#ffffff', WORLDS[Game.L.w].ac][fw0 % 3], 5); Game.spin += Game.L.sp * .034 * 60 * el;
    if (Game.clearT > 1.7) goNext();
  } else if (Game.state === 'count') {
    Game.countT -= el;
    if (Game.countT <= 0) { Game.state = 'play'; Game.acc = 0; startMusic(); }
  } else if (Game.state === 'dying' || Game.state === 'over') {
    Game.dieT -= el;
    if (Game.hit > 0) Game.hit -= el; else Game.dieAge += el;
    if (Game.state === 'dying' && Game.dieT <= 0) afterDeath();
  }
  // effets visuels (indépendants de la physique), figés pendant l'arrêt sur image
  if (Game.hit <= 0) {
    const ps = Game.parts; let w = 0;
    for (let i = 0; i < ps.length; i++) { const p = ps[i]; p.x += p.vx * el * 60; p.y += p.vy * el * 60; p.vy += (p.g === undefined ? .35 : p.g) * el * 60; p.a -= (p.f || 1.6) * el; if (p.a > 0) ps[w++] = p; }
    ps.length = w;
    for (const q of Game.pops) { q.y -= 34 * el; q.a -= 1.1 * el; }
    Game.pops = Game.pops.filter(q => q.a > 0);
  }

  Game.sx += (1 - Game.sx) * Math.min(1, el * 12); Game.sy += (1 - Game.sy) * Math.min(1, el * 12);
  render(tm);

}

function tick() {
  const L = Game.L, P = Game.P;
  const press = Inp.queued, down = Inp.down || Inp.queued;
  Inp.queued = false;
  Game.t++;
  const wasG = P.onG;
  Game.px = P.x; Game.py = P.y;
  const ev = step(L, P, Game.t, press, down);
  Game.spin += L.spAt(P.x) * .034 * (P.onG ? 1 : .6);
  Game.trail.push([P.x, P.y]); if (Game.trail.length > 14) Game.trail.shift();
  if (Game.cur) { if (Game.cur.n < Game.cur.ys.length) Game.cur.ys[Game.cur.n++] = Math.round(P.y * 4); }

  if (ev === 'jump') { Snd.sfx('jump'); Game.sx = .72; Game.sy = 1.35; D().st.jumps++; dust(P.x, Game.py + PR, 4, 1.6); }
  else if (ev === 'djump') { Snd.sfx('djump'); Game.sx = .7; Game.sy = 1.4; D().st.jumps++; D().st.djumps++; Game.usedDj = true; burst(P.x, P.y + PR, 8, curSkin().c[0], 2.5); }
  else if (ev === 'orb') { Snd.sfx('orb'); D().st.orbs++; burst(P.x, P.y, 14, '#ff7ae6', 4); }
  else if (ev === 'pad') { Snd.sfx('pad'); D().st.pads++; Game.sx = .65; Game.sy = 1.5; }
  if (!wasG && P.onG && ev === '') { Game.sx = 1.32; Game.sy = .72; Snd.sfx('land'); dust(P.x, P.y + PR, 6, 2.4); }

  if (ev.startsWith('die')) return die(ev.slice(4));

  // éclairs
  if (L.mode === 'story') {
    const C = lvCoins(L.i);
    for (let i = 0; i < C.length / 2; i++) {
      if (Game.coins >> i & 1) continue;

    }
    if (L.boss && !Game.ph2 && P.x > L.len / 2) { Game.ph2 = true; banner('PHASE 2', 'ÇA ACCÉLÈRE', 1000); Game.shake = 7; Snd.sfx('pad'); }
  }

  const list = $('lbList'), info = $('lbInfo'); list.innerHTML = '';
  const day = mode === 'daily' ? today() : 'all', d = D();
  const fmt = r => mode === 'story' ? [`${r.extra} niv.`, `${r.deaths} morts`] : [`${r.score} m`, mode === 'daily' ? `${r.deaths} essais` : `${r.deaths} parties`];
  const mine = () => {
    if (mode === 'story') { let lv = 0, de = 0; for (let i = 0; i < 100; i++) { const l = d.lv[i]; if (l && l.done) { lv++; de += l.best; } } return { name: d.name, score: lv * 100000 - de, deaths: de, extra: lv, player_id: d.pid }; }
    if (mode === 'daily') { const x = d.st.daily[today()] || { best: 0, tries: 0 }; return { name: d.name, score: x.best, deaths: x.tries, player_id: d.pid }; }
    return { name: d.name, score: d.st.endBest, deaths: d.st.endRuns, player_id: d.pid };
  };
  const row = (r, rk) => {
    const e = document.createElement('div'); e.className = 'lr' + (r.player_id === d.pid ? ' me' : '');
    const [a, b] = fmt(r);
    e.innerHTML = `<span class="rk">${rk}</span><span class="nm"></span><span class="sc">${a}</span><span class="de">${b}</span>`;
    e.querySelector('.nm').textContent = r.name; list.appendChild(e);
  };
  info.textContent = mode === 'story' ? 'Rang : niveaux terminés, puis le moins de morts (meilleur essai par niveau).' : mode === 'daily' ? `Défi du ${today().split('-').reverse().join('/')} : même parcours pour tout le monde.` : 'Plus longue distance en une course.';
  if (!LB.online()) { info.textContent += ' Classement mondial pas encore activé : tes scores seulement.'; row(mine(), '—'); return; }
  info.textContent += ' Chargement…';
  const rows = await LB.top(mode, day, 50);
  if (lbMode !== mode) return;
  info.textContent = info.textContent.replace(' Chargement…', '');
  if (!rows) { info.textContent += ' Connexion impossible.'; row(mine(), '—'); return; }
  rows.forEach((r, i) => row(r, i + 1));
  if (!rows.some(r => r.player_id === d.pid)) { const me = mine(); if (me.score > 0) { const rk = await LB.rank(mode, day, me.score); row(me, rk || '—'); } }
  if (!rows.length) info.textContent += ' Personne encore : à toi de jouer.';
}

function refreshToggles() {
  const s = D().set;
  document.querySelectorAll('.tog,.tog2').forEach(b => { const k = b.dataset.s; b.classList.toggle('on', !!s[k]); b.textContent = (b.classList.contains('tog2') ? (k === 'music' ? 'MUSIQUE ' : 'SONS ') : '') + (s[k] ? 'ON' : 'OFF'); });
}
function buildSet() { $('setName').value = D().name; $('setVol').value = D().set.vol; refreshToggles(); }
function applySettings() { const s = D().set; Snd.S.music = s.music; Snd.S.sfx = s.sfx; Snd.setVol(s.vol); if (!s.music) Snd.stop(); }

// ── PARTAGE ──────────────────────────────────────────────────────
async function share(text) {
  const url = location.href.split('#')[0].split('?')[0];
  D().st.shares++; Save.save(); checkAch();
  try { if (navigator.share) { await navigator.share({ title: 'BoltBall', text, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toastMsg('Copié dans le presse-papier'); } catch (e) { }
}
function toastMsg(m) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<div class="t"></div>'; el.querySelector('.t').textContent = m; $('toasts').appendChild(el); setTimeout(() => el.classList.add('out'), 1800); setTimeout(() => el.remove(), 2200); }

// ── ENTRÉES ──────────────────────────────────────────────────────
Inp.ptr = 0; Inp.key = false;
function updDown() { Inp.down = Inp.ptr > 0 || Inp.key; }
function pressStart() { if (Game.state === 'play') Inp.queued = true; }
function ptrEnd() { Inp.ptr = Math.max(0, Inp.ptr - 1); updDown(); }
cv.addEventListener('pointerdown', e => { Snd.unlock(); Inp.ptr++; updDown(); if (Game.state === 'clear' && Game.clearT > .45) goNext(); else pressStart(); });
addEventListener('pointerup', ptrEnd); addEventListener('pointercancel', ptrEnd); addEventListener('blur', () => { Inp.ptr = 0; Inp.key = false; updDown(); });
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];
addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') { if (e.key === 'Enter' && document.activeElement.id === 'inp') $('bName').click(); return; }
  if (JUMP_KEYS.includes(e.code)) {
    e.preventDefault(); if (e.repeat) return; Snd.unlock();
    Inp.key = true; updDown();
    if (Game.state === 'play') pressStart();
    else if (Game.state === 'over') restart();
    else if (Game.state === 'clear' && Game.clearT > .45) goNext();
  } else if (e.code === 'KeyR' && !e.repeat) { if (['play', 'dying', 'over', 'pause'].includes(Game.state)) restart(true); }
  else if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { if (['play', 'count', 'dying'].includes(Game.state)) pause(); else if (Game.state === 'pause') resume(); }
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) { Inp.key = false; updDown(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); Snd.stop(); Save.save(); } });
addEventListener('resize', resize);

// boutons
$('pbtn').addEventListener('pointerdown', e => { e.stopPropagation(); pause(); });
$('bName').onclick = () => {
  const v = $('inp').value.trim().toUpperCase().replace(/[^A-Z0-9ÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ _-]/g, '');
  if (!v) { $('inp').placeholder = 'PSEUDO REQUIS'; return; }
  D().name = v; Save.save(); Snd.unlock(); openScr('home');
};
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { Snd.unlock(); openScr(b.dataset.go); });
$('bResume').onclick = resume;
$('bRestart').onclick = () => { showScr(null); Game.state = 'play'; restart(); };
$('bPractice').onclick = () => startStory(Game.lvl, !Game.practice);
$('bQuit').onclick = quitToMenu;
$('bRetry').onclick = () => startStory(Game.lvl, false);
$('bMenu1').onclick = () => { quitToMenu(); openScr('story'); };
$('bMenu2').onclick = quitToMenu;
$('bAgain').onclick = () => startEndless(Game.mode === 'daily');
$('s-over').addEventListener('pointerdown', e => { if (e.target === $('s-over')) startEndless(Game.mode === 'daily'); });
$('bShare1').onclick = () => { const L = Game.L; share(`⚡ BoltBall : ${L.boss ? 'boss ' + L.name : 'niveau ' + L.name} terminé ${Game.deaths === 0 ? 'sans mourir' : 'en ' + Game.deaths + ' mort' + (Game.deaths > 1 ? 's' : '')}. Tu fais mieux ?`); };
$('bShare3').onclick = () => Game.mode === 'story' ? share(`⚡ BoltBall : je suis au ${levelLabel(Game.L).toLowerCase()}. Tu fais mieux ?`) : share(`⚡ BoltBall : record ${Game.mode === 'daily' ? ((D().st.daily[Game.day] || {}).best || 0) + ' m au défi du jour' : D().st.endBest + ' m en Endless'}. Bats-moi !`);
$('bShare2').onclick = () => share(`⚡ BoltBall : ${Game.lastRun ? Game.lastRun.m : 0} m ${Game.mode === 'daily' ? 'au défi du jour' : 'en Endless'}. Bats-moi !`);
document.querySelectorAll('#collTabs button').forEach(b => b.onclick = () => { collF = b.dataset.f; document.querySelectorAll('#collTabs button').forEach(x => x.classList.toggle('on', x === b)); buildColl(); });
document.querySelectorAll('#lbTabs button').forEach(b => b.onclick = () => loadLb(b.dataset.m));
document.querySelectorAll('.tog,.tog2').forEach(b => b.onclick = () => { const s = D().set, k = b.dataset.s; s[k] = !s[k]; Save.save(); applySettings(); refreshToggles(); });
$('setVol').oninput = e => { D().set.vol = +e.target.value; applySettings(); Save.save(); };
$('setName').onchange = e => { const v = e.target.value.trim().toUpperCase(); if (v) { D().name = v; Save.save(); } };
let resetArm = 0;
$('bReset').onclick = () => {
  if (Date.now() - resetArm > 3000) { resetArm = Date.now(); $('bReset').textContent = 'SÛR ? TAPE ENCORE'; setTimeout(() => $('bReset').textContent = 'EFFACER MA PROGRESSION', 3000); return; }
  Save.reset(); applySettings(); toastMsg('Progression effacée'); openScr('home');
};
let logoTaps = 0;
$('logo').onclick = () => { if (++logoTaps === 10) { D().fl.logo = 1; Save.save(); checkAch(); } };

// ── DÉMARRAGE ────────────────────────────────────────────────────
Save.load(); applySettings(); timeFlags(); Save.save();
resize();
if (D().name) openScr('home'); else { showScr('s-name'); }
checkAch();
requestAnimationFrame(frame);
addEventListener('pagehide', () => Save.save());

</script>
</body>
